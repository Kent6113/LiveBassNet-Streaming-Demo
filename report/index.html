<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LiveBassNet Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Serif&display=swap">
<link rel="stylesheet" href="../common/site.css">
<style>
  article { display: grid; gap: 14px; min-width: 0; }
  article h2 { margin-top: 1.2rem; }
  article h2.part { font-size: .78rem; text-transform: uppercase; letter-spacing: .12em; color: var(--accent); border-top: 2px solid var(--accent); padding-top: 10px; margin-top: 2rem; }
  article h3 { margin-top: .6rem; }
  article p, article li { max-width: 72ch; }
  article ol, article ul { margin: 0; padding-left: 1.4rem; display: grid; gap: 6px; }
  article li > p { margin: 0; }
  article table { display: block; overflow-x: auto; font-variant-numeric: tabular-nums; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
  article th { font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--soft); }
  article .fig { display: block; font-size: .86rem; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
  article code { font-family: var(--mono); font-size: .88em; }
  nav.toc { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow"><a href="../">LiveBassNet</a> · report</span>
  <h1>LiveBassNet: a live bass accompanist</h1>
  <p class="lead">Part 1 argues the case for a paper against the closest work; Part 2 is the full record of methods and results. Both are kept in sync with the working documents.</p>
  <div id="gate"></div>
  <nav class="toc" id="toc" hidden><a href="#case">Part 1 · The case for a paper</a><a href="#full">Part 2 · Full results</a></nav>
  <article id="doc"></article>
</div>
<script type="module">
import { unlock } from '../common/vault.js';
const v = await unlock('../private', document.getElementById('gate'));
document.getElementById('doc').innerHTML = await v.text('report.html');
document.getElementById('toc').hidden = false;
if (location.hash) document.querySelector(location.hash)?.scrollIntoView();
</script>
</body>
</html>
